services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enews
      POSTGRES_PASSWORD: enews_dev_password
      POSTGRES_DB: enews
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enews"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
