services:
  - type: web
    name: e-news-platform
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enews-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: MEDIA_DIR
        value: ./uploads
      - key: APP_URL
        value: https://e-news-platform.onrender.com

databases:
  - name: enews-postgres
    plan: free
    databaseName: enews
    user: enews
